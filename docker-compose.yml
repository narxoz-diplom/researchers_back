# Local "full-stack" dev compose: Postgres + API in one shot.
# For production deployment use docker-compose.prod.yml.
#
# Usage:
#   cp .env.example .env
#   docker compose up --build
#
# To seed demo data:
#   docker compose run --rm api npm run seed

services:
  postgres:
    image: postgres:15-alpine
    container_name: researchers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: researchers
      POSTGRES_PASSWORD: researchers
      POSTGRES_DB: researchers
    ports:
      - '5433:5432'
    volumes:
      - researchers_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U researchers']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: researchers-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://researchers:researchers@postgres:5432/researchers
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required (see .env.example)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required (see .env.example)}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@researchers.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
    ports:
      - '8080:8080'
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/main.js"

volumes:
  researchers_pg:
