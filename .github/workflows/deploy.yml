name: Deploy API

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (defaults to current commit sha)'
        required: false

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/researchers-api

jobs:
  build-and-push:
    name: Build & push API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      owner_lower: ${{ steps.meta.outputs.owner_lower }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          OWNER_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SHA="${{ github.sha }}"
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "${TAG}" ]]; then TAG="sha-${SHA::12}"; fi
          {
            echo "image_tag=${TAG}"
            echo "owner_lower=${OWNER_LOWER}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ vars.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/researchers-api:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/researchers-api:latest

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.PROD_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production environment secrets
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ vars.VPS_SSH_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty. Add it under Settings → Environments → production → Environment secrets (not only Repository secrets)."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then exit 1; fi

      - name: Write SSH deploy key
        env:
          VPS_SSH_KEY: ${{ vars.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Sync infra files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key_path: ~/.ssh/deploy_key
          port: 22
          source: "docker-compose.prod.yml,deploy/"
          target: "/home/${{ vars.VPS_USER }}/researchers"
          overwrite: true
          strip_components: 0

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key_path: ~/.ssh/deploy_key
          port: 22
          script: |
            set -euo pipefail
            cd /home/${{ vars.VPS_USER }}/researchers
            chmod +x deploy/scripts/*.sh
            echo "${{ vars.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            bash deploy/scripts/deploy.sh \
              "${{ needs.build-and-push.outputs.image_tag }}" \
              "${WEB_IMAGE_TAG:-latest}"
